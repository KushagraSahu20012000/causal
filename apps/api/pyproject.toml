[project]
name = "causal-api"
version = "0.1.0"
description = "FastAPI and LangGraph backend for Causal"
requires-python = ">=3.12,<3.15"
dependencies = [
  "fastapi>=0.115,<1",
  "langchain-core>=0.3,<2",
  "langchain-groq>=0.2,<2",
  "langgraph>=0.2,<2",
  "langgraph-checkpoint-postgres>=2,<4",
  "psycopg[binary,pool]>=3.2,<4",
  "pydantic>=2.10,<3",
  "python-dotenv>=1,<2",
  "pyyaml>=6.0.2,<7",
  "truststore>=0.10,<1",
  "uvicorn[standard]>=0.34,<1",
]

[project.optional-dependencies]
dev = [
  "httpx>=0.28,<1",
  "pytest>=8,<9",
  "pytest-asyncio>=0.25,<2",
  "ruff>=0.9,<1",
]

[tool.vercel]
entrypoint = "main:app"

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
